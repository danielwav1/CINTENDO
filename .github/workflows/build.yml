name: CINTENDO Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - uses: actions/checkout@v4

      - name: Build CINTENDO
        run: make

      - uses: actions/upload-artifact@v4
        with:
          name: CINTENDO-3DS
          path: |
            CINTENDO.3dsx
            CINTENDO.smdh
